<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MALI SUGU — Annonces au Mali</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; color: #193326; background: #f4f7f3; }
    header { background: white; padding: 18px 5%; font-size: 22px; font-weight: bold; color: #087b45; }
    .hero { background: #087b45; color: white; padding: 45px 5%; text-align: center; }
    h1 { margin: 0 0 12px; font-size: 32px; }
    .hero p { margin: 0 0 22px; }
    .search { display: flex; max-width: 500px; margin: auto; background: white; border-radius: 10px; padding: 5px; }
    .search input { flex: 1; min-width: 0; border: 0; padding: 12px; font-size: 16px; }
    .search button { border: 0; border-radius: 8px; background: #f5b926; padding: 12px; font-weight: bold; }
    main { max-width: 900px; margin: auto; padding: 28px 16px; }
    .categories { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
    .categories span { background: white; border-radius: 10px; padding: 12px; }
    .product { max-width: 540px; background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 3px 12px #0002; }
    .photos { display: flex; gap: 8px; padding: 10px; }
    .photos img { width: calc(50% - 4px); height: 190px; object-fit: contain; background: #f4f7f3; }
    .details { padding: 18px; }
    .details h3 { margin-top: 0; }
    .price { color: #087b45; font-size: 24px; font-weight: bold; }
    .call { display: inline-block; background: #087b45; color: white; padding: 13px 16px; border-radius: 9px; text-decoration: none; }
    footer { background: #123d2a; color: white; text-align: center; padding: 22px; margin-top: 30px; }
  </style>
</head>
<body>
  <header>🇲🇱 MALI SUGU</header>

  <section class="hero">
    <h1>Bienvenue sur MALI SUGU</h1>
    <p>Découvrez et achetez des produits au Mali.</p>
    <form class="search" id="searchForm">
      <input id="searchInput" type="search" placeholder="Rechercher un produit" aria-label="Rechercher un produit">
      <button type="submit">Chercher</button>
    </form>
  </section>

  <main>
    <h2>Catégories</h2>
    <div class="categories">
      <span>🛠️ Construction</span>
      <span>🏠 Maison</span>
      <span>📱 Électronique</span>
      <span>📦 Autres</span>
    </div>

    <h2 id="annonces">Annonces</h2>
    <article class="product" id="product">
      <div class="photos">
        <img src="IMG-20260903-WA0017.jpg" alt="Première photo">
<img src="IMG-20260903-WA0018.jpg" alt="Deuxième photo">
      </div>
      <div class="details">
        <h3>Coffret de scies cloches diamantées</h3>
        <p class="price">70 000 F CFA</p>
        <a class="call" href="tel:+22379231920">📞 Appeler le 79 23 19 20</a>
      </div>
    </article>
    <p id="empty" hidden>Aucun produit trouvé.</p>
  </main>

  <footer>© 2026 MALI SUGU 🇲🇱</footer>

  <script>
    document.getElementById('searchForm').addEventListener('submit', function (event) {
      event.preventDefault();
      const search = document.getElementById('searchInput').value.trim().toLowerCase();
      const found = !search || 'coffret de scies cloches diamantées construction'.includes(search);
      document.getElementById('product').hidden = !found;
      document.getElementById('empty').hidden = found;
      document.getElementById('annonces').scrollIntoView();
    });
  </script>
</body>
</html>
