<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MALI SUGU</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
      padding-bottom: 80px;
    }

    header {
      background: linear-gradient(135deg, #0b8f4d, #066b39);
      color: white;
      padding: 22px 16px;
      text-align: center;
    }

    header h1 {
      font-size: 30px;
    }

    header p {
      margin-top: 6px;
      font-size: 14px;
    }

    .search {
      padding: 15px;
      background: white;
    }

    .search input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    .container {
      padding: 15px;
      max-width: 900px;
      margin: auto;
    }

    h2 {
      margin: 15px 0 12px;
      font-size: 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    .category {
      background: white;
      border-radius: 12px;
      padding: 12px 5px;
      text-align: center;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .category span {
      display: block;
      font-size: 28px;
      margin-bottom: 5px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .product {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 2px 10px rgba(0,0,0,.08);
    }

    .product-image {
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #e8f5ed;
      font-size: 55px;
    }

    .product-info {
      padding: 12px;
    }

    .product h3 {
      font-size: 16px;
      margin-bottom: 5px;
    }

    .price {
      color: #078346;
      font-weight: bold;
      margin: 7px 0;
    }

    button {
      border: none;
      cursor: pointer;
    }

    .add {
      width: 100%;
      background: #0b8f4d;
      color: white;
      padding: 9px;
      border-radius: 8px;
      font-weight: bold;
    }

    .seller {
      background: white;
      margin-top: 20px;
      padding: 18px;
      border-radius: 15px;
      box-shadow: 0 2px 10px rgba(0,0,0,.07);
    }

    .seller p {
      margin: 8px 0;
    }

    .payments {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .payment {
      padding: 9px 12px;
      background: #eee;
      border-radius: 20px;
      font-size: 13px;
      font-weight: bold;
    }

    .cart-box {
      background: white;
      padding: 18px;
      border-radius: 15px;
      margin-top: 20px;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px solid #eee;
      padding: 10px 0;
    }

    .total {
      font-size: 20px;
      font-weight: bold;
      margin-top: 15px;
    }

    .order {
      width: 100%;
      background: #ffb000;
      padding: 14px;
      margin-top: 15px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 65px;
      background: white;
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #ddd;
      z-index: 10;
    }
        
  </style>
</head>
<body>
  <h1>Bienvenue sur MALI SUGU 🇲🇱</h1>
  <p>Notre site fonctionne.</p>
</body>
</html>
